name: 缺陷报告
description: 报告 vust-suite-host-scanner 的可复现问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请尽量说明问题现象。不要在 issue 中粘贴敏感目标、凭据或内网地址。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要说明遇到的问题、影响和实际现象。
      placeholder: 例如：主机扫描任务在解析某类目标时失败。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 扫描任务创建
        - 目标解析
        - 探测执行
        - 结果上报
        - 配置/部署
        - 文档
        - 其他
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: 复现方式
      description: 如能复现，请写出步骤；不能稳定复现也可以留空。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 如相关，请填写版本、操作系统、架构、Docker/运行方式等。
      placeholder: |
        VUST 版本：
        套件版本/提交：
        操作系统：
        架构：
        运行方式：
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 粘贴相关日志，注意脱敏。
      render: shell
    validations:
      required: false
