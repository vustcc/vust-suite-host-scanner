name: Publish Docker Image

run-name: "host-scanner image ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Suite image version
        required: true
        default: 0.1.0-alpha.1
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./build-image.sh "$RELEASE_VERSION"

      - name: Push image
        run: docker push "vustcc/host-scanner:${{ inputs.version }}"

      - name: Sync Docker Hub README
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: vustcc/host-scanner
          readme-filepath: README.md
